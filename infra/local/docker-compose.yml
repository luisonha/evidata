version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: evidata_dev
      POSTGRES_USER: evidata
      POSTGRES_PASSWORD: evidata_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
