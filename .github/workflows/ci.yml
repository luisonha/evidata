name: CI

on:
  push:
    branches:
      - develop
      - main
      - 'dev/**'
  pull_request:
    branches:
      - develop
      - main
      - 'dev/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Evidata.sln

      - name: Build
        run: dotnet build Evidata.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Evidata.sln --no-build --configuration Release --verbosity minimal
